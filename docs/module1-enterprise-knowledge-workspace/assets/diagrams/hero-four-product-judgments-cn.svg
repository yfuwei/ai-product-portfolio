<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">四次产品判断</title>
  <desc id="desc">从证据与来源、Router 与 Tool、资格与确认，到组织、证据与责任重新分层的四阶段产品判断。</desc>
  <defs>
    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
    <linearGradient id="final-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff" />
      <stop offset="1" stop-color="#e0f2fe" />
    </linearGradient>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .stage-title { fill: #0f172a; font-size: 29px; font-weight: 800; }
      .stage-focus { fill: #1e3a5f; font-size: 25px; font-weight: 750; }
      .stage-note { fill: #64748b; font-size: 21px; font-weight: 500; }
    </style>
  </defs>

  <rect x="70" y="55" width="1300" height="970" rx="34" fill="#ffffff" filter="url(#panel-shadow)" />
  <rect x="70.5" y="55.5" width="1299" height="969" rx="33.5" fill="none" stroke="#e2e8f0" />

  <text x="138" y="151" fill="#0f172a" font-size="45" font-weight="850">四次产品判断</text>
  <rect x="1012" y="105" width="276" height="52" rx="26" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="1150" y="139" fill="#2563eb" font-size="16" font-weight="850" letter-spacing="1.4" text-anchor="middle">BUILD / USE / INTEGRATE</text>

  <line x1="184" y1="278" x2="184" y2="870" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />

  <g aria-label="阶段一">
    <circle cx="184" cy="307" r="30" fill="#ffffff" stroke="#60a5fa" stroke-width="5" />
    <text x="184" y="317" fill="#2563eb" font-size="26" font-weight="850" text-anchor="middle">1</text>
    <rect x="252" y="218" width="1048" height="172" rx="22" fill="#ffffff" stroke="#dbe3ee" stroke-width="2" />
    <rect x="252" y="218" width="8" height="172" rx="4" fill="#93c5fd" />
    <text class="stage-title" x="302" y="272">V1｜知识从哪里来</text>
    <text class="stage-focus" x="302" y="320">证据与来源</text>
    <text class="stage-note" x="302" y="360">让路径、章节与原文可追溯</text>
  </g>

  <g aria-label="阶段二">
    <circle cx="184" cy="496" r="30" fill="#ffffff" stroke="#60a5fa" stroke-width="5" />
    <text x="184" y="506" fill="#2563eb" font-size="26" font-weight="850" text-anchor="middle">2</text>
    <rect x="252" y="407" width="1048" height="172" rx="22" fill="#ffffff" stroke="#dbe3ee" stroke-width="2" />
    <rect x="252" y="407" width="8" height="172" rx="4" fill="#60a5fa" />
    <text class="stage-title" x="302" y="461">V2｜什么时候调用</text>
    <text class="stage-focus" x="302" y="509">Router 与 Tool</text>
    <text class="stage-note" x="302" y="549">让任务决定是否调用知识</text>
  </g>

  <g aria-label="阶段三">
    <circle cx="184" cy="685" r="30" fill="#ffffff" stroke="#3b82f6" stroke-width="5" />
    <text x="184" y="695" fill="#1d4ed8" font-size="26" font-weight="850" text-anchor="middle">3</text>
    <rect x="252" y="596" width="1048" height="172" rx="22" fill="#ffffff" stroke="#dbe3ee" stroke-width="2" />
    <rect x="252" y="596" width="8" height="172" rx="4" fill="#3b82f6" />
    <text class="stage-title" x="302" y="650">V3｜现在能不能用</text>
    <text class="stage-focus" x="302" y="698">资格与确认</text>
    <text class="stage-note" x="302" y="738">让版本、范围与冲突先准入</text>
  </g>

  <g aria-label="当前重估">
    <circle cx="184" cy="874" r="34" fill="#2563eb" />
    <path d="M173 892v-39m0 3c14-10 27 8 43-3v23c-16 11-29-8-43 3" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="252" y="785" width="1048" height="172" rx="22" fill="url(#final-card)" stroke="#93c5fd" stroke-width="2" />
    <rect x="252" y="785" width="8" height="172" rx="4" fill="#2563eb" />
    <text class="stage-title" x="302" y="839">当前重估｜什么还值得自建</text>
    <text class="stage-focus" x="302" y="887">组织、证据与责任重新分层</text>
    <text class="stage-note" x="302" y="927">成熟能力归位，最终责任留在产品流程</text>
  </g>
</svg>
